name: Test reusable workflow

on:
  workflow_call:
    inputs:
      string_input:
        required: true
        type: string
        description: "sample_input"

permissions: {}

jobs:
  echo:
    runs-on: ubuntu-latest
    outputs:
      deprecated_style_output: ${{ steps.set-output-step.outputs.deprecated_style_output }}
      new_style_output: ${{ steps.set-output-step.outputs.new_style_output }}
    steps:
      - name: Set output
        id: set-output-step
        run: |
          echo "deprecated_style_output=${INPUTS_STRING_INPUT}" >> "${GITHUB_OUTPUT}"
          echo "new_style_output=${INPUTS_STRING_INPUT}" >> "${GITHUB_OUTPUT}"
        env:
          INPUTS_STRING_INPUT: ${{ inputs.string_input }}
